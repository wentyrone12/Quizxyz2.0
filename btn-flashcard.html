<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>WHITE_QUIZXYZ 2.0</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <a class="btn-back" href="index.html">Back</a>

  <button id="settingsBtn" class="settings-btn" onclick="toggleSettings()">⚙️</button>

  <div id="settingsCard" class="settings-card hidden">
    <div class="setting-item" onclick="openQA()">❓Q & A</div>
    <div class="setting-item" onclick="openMusic()">🎵 Music</div>
  </div>

  <!-- PROFILE CARD -->
  <!-- QUESTIONS & ANSWERS CARD -->
  <div id="qaCard" class="settings-card hidden">

    <div class="qa-header">
      <h2>Question and Answer</h2>
      <button class="btn-saveback-1" onclick="backToSettings()">⬅ Back</button>
    </div>

    <div id="qaContainer" class="qa-container"></div>

  </div>

  <!-- MUSIC CARD -->
  <div id="musicCard" class="settings-card hidden">
    <h3 class="music-player">🎵 Music Player</h3>
    <audio id="audioPlayer"></audio>

    <p id="musicTitle">No song</p>

    <div class="music-controls">
      <button onclick="prevMusic()">⏮</button>
      <button onclick="togglePlay()">▶ / ⏸</button>
      <button onclick="nextMusic()">⏭</button>
    </div>

    <button class="btn-musicback" onclick="backToSettings()">⬅ Back</button>
  </div>

  <div id="ConversationCard" class="settings-card hidden">
    <h3 class="setting-convo">Coming soon...</h3>
    <button class="btn-saveback" onclick="backToSettings()">⬅ Back</button>
  </div>

  <button id="themeToggle" class="themebtn" onclick="toggleTheme()">☀️</button>

  <div id="reviewer" class="hidden">

    <div id="mother-container">

      <h2 class="FC-tag">Flash Card</h2>
      <span id="counter">0 / 0</span>
      <div id="cardContainer"></div>

      <div class="nav">
        <button id="prevBtn" onclick="prevCard()">⬅Previous</button>
        <button class="shuffle" onclick="shuffleCards()">🔀 Shuffle</button>
        <button id="nextBtn" onclick="nextCard()">Next➡</button>
      </div>
    </div>
  </div>

  <button class="delete-all-btn" onclick="deleteAllCards()">🗑 Delete All</button>

  <div class="nametag-1">Made by Wenxyz</div>


  <script type="module" src="script.js"></script>
</body>

</html>
