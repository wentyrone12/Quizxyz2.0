<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards - WHITE_QUIZXYZ 2.0</title>
  <link rel="icon" href="logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="navbar">
    <div class="nav-left"><a href="index.html" class="back-link">← Home</a><img src="logo.png"
        class="nav-logo small"><span class="brand">FLASHCARD</span></div>
    <div class="nav-right"><button id="settingsBtn" class="icon-btn" onclick="toggleSettings()">⚙️</button><button
        id="themeToggle" class="icon-btn" onclick="toggleTheme()">🌙</button></div>
  </nav>
  <div id="settingsCard" class="overlay hidden">
    <div class="overlay-card glass">
      <div class="overlay-header">
        <h3>Menu</h3><button class="close-btn" onclick="toggleSettings()">✕</button>
      </div>
      <div class="overlay-body">
        <div class="menu-item" onclick="openQA()"><span class="menu-icon">❓</span>
          <div><strong>Q & A List</strong>
            <p>View all</p>
          </div>
        </div>
        <div class="menu-item" onclick="openMusic()"><span class="menu-icon">🎵</span>
          <div><strong>Focus Music</strong>
            <p>Lo-fi study</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="qaCard" class="overlay hidden">
    <div class="overlay-card glass large">
      <div class="overlay-header">
        <h3>Q & A</h3><button class="close-btn" onclick="backToSettings()">✕</button>
      </div>
      <div id="qaContainer" class="qa-container"></div>
    </div>
  </div>
  <div id="musicCard" class="overlay hidden">
    <div class="overlay-card glass">
      <div class="overlay-header">
        <h3>🎵 Focus Player</h3><button class="close-btn" onclick="backToSettings()">✕</button>
      </div>
      <div class="music-body"><audio id="audioPlayer"></audio>
        <div class="music-art">🎧</div>
        <p id="musicTitle" class="music-title">No song</p>
        <div class="music-controls"><button onclick="prevMusic()">⏮</button><button class="play-btn"
            onclick="togglePlay()">▶ / ⏸</button><button onclick="nextMusic()">⏭</button></div>
      </div>
    </div>
  </div>
  <div id="ConversationCard" class="overlay hidden">
    <div class="overlay-card glass">
      <div style="padding:20px;text-align:center">
        <h3>Coming soon...</h3><br><button class="btn-secondary" onclick="backToSettings()">Back</button>
      </div>
    </div>
  </div>
  <main class="study-container">
    <div id="reviewer">
      <div id="mother-container">
        <div class="study-header">
          <h2 class="FC-tag">Flash Cards</h2><span id="counter" class="counter-pill">0 / 0</span>
        </div>
        <div id="cardContainer" class="card-stage"></div>
        <div class="nav-controls"><button id="prevBtn" class="btn-nav" onclick="prevCard()">← Prev</button><button
            class="btn-nav shuffle-btn" onclick="shuffleCards()">🔀 Shuffle</button><button id="nextBtn" class="btn-nav"
            onclick="nextCard()">Next →</button></div>
        <div class="hint">Tap to flip • Swipe left/right</div>
      </div>
    </div>
    <div class="danger-zone"><button class="delete-all-btn" onclick="deleteAllCards()">🗑 Delete All</button></div>
    <footer class="footer">Made by <strong>Wenxyz</strong></footer>
  </main>
  <script type="module" src="script.js"></script>
</body>

</html>
